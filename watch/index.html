<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Watch — ParNinja</title>
    <meta name="description" content="Watch a shared ParNinja round replay." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#14532d" />
    <link rel="icon" href="../assets/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/watch.css?v=30" />
    <script src="../config.js"></script>
  </head>
  <body>
    <div class="watch-app">
      <header class="watch-top">
        <div class="watch-brand">
          <a
            class="brand-link"
            id="brand-link"
            href="../"
            aria-label="Open in ParNinja"
            title="Open in ParNinja"
          >
            <img src="../assets/icon.png" alt="" width="28" height="28" />
          </a>
          <div class="watch-meta">
            <p class="course" id="meta-course">Loading…</p>
            <p class="sub meta-duration" id="meta-duration" hidden></p>
            <p class="sub" id="meta-hole">—</p>
          </div>
          <button type="button" class="speed-chip" id="btn-speed" title="Playback speed" aria-label="Playback speed">
            1x
          </button>
        </div>
        <div class="scorecard-wrap" aria-label="Scorecard">
          <div class="scorecard" id="scorecard" role="table"></div>
        </div>
      </header>

      <div class="watch-map-wrap">
        <div id="watch-map" role="img" aria-label="Hole map replay"></div>

        <div class="yards-panel hidden" id="yards-chip" aria-live="polite">
          <span class="yards-value" id="yards-value"></span>
          <span class="yards-unit">yds remaining</span>
        </div>

        <div class="putt-overlay hidden" id="putt-overlay" aria-live="polite"></div>

        <div class="map-empty" id="map-empty" aria-live="polite">
          <p>No GPS Data</p>
          <p class="map-empty-sub">Need GPS-tracked shots to create replay</p>
        </div>

        <div class="map-controls-overlay">
          <div class="stroke-scrubber" aria-label="Stroke scrubber">
            <p class="scrubber-label" id="scrubber-label">—</p>
            <div class="scrubber-ticks" id="scrubber-ticks"></div>
          </div>

          <div class="playback-row" aria-label="Playback controls">
            <button type="button" class="skip-btn" id="btn-prev-hole" title="Previous hole" aria-label="Previous hole">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M18.41 16.59L13.82 12l4.59-4.59L17 6l-6 6 6 6zM6 6h2v12H6z"/></svg>
            </button>
            <button type="button" class="skip-btn" id="btn-prev-stroke" title="Previous stroke" aria-label="Previous stroke">
              <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button type="button" class="play-btn" id="btn-play" title="Play" aria-label="Play">
              <svg class="icon-play" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true" hidden><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button type="button" class="skip-btn" id="btn-next-stroke" title="Next stroke" aria-label="Next stroke">
              <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
            <button type="button" class="skip-btn" id="btn-next-hole" title="Next hole" aria-label="Next hole">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M5.59 7.41L10.18 12l-4.59 4.59L7 18l6-6-6-6zM16 6h2v12h-2z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="js/pinLabel.js?v=30"></script>
    <script src="js/replayEngine.js?v=30"></script>
    <script src="js/mapLibreAdapter.js?v=30"></script>
    <script src="js/shareCodec.js?v=30"></script>
    <script src="js/watch.js?v=30"></script>
  </body>
</html>
