<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParNinja — Golf analytics & performance tracking</title>
    <meta
      name="description"
      content="ParNinja is your personal golf analytics companion. Track every shot, analyze performance, and improve your game."
    />
    <meta name="theme-color" content="#388e3c" />
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="config.js"></script>
  </head>
  <body>
    <div class="page">
      <main class="container">
        <section class="hero">
          <div class="hero-inner">
            <div class="hero-copy">
              <div class="brand-mark">
                <img src="assets/icon.png" alt="" width="52" height="52" id="site-icon" />
                <span id="site-name">ParNinja</span>
              </div>
              <h1 id="site-tagline">Your personal golf analytics companion</h1>
              <p class="lead" id="site-description">
                Track every shot, analyze your performance, and discover insights that help you
                improve your game.
              </p>
            </div>
            <div class="hero-visual" aria-hidden="true">
              <div class="app-showcase">
                <img src="assets/icon.png" alt="" id="hero-icon" />
              </div>
            </div>
          </div>
        </section>

        <section class="apps-section" aria-labelledby="apps-heading">
          <p class="section-label" id="apps-heading">Download</p>
          <div class="apps-grid" id="apps-grid"></div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="container">
          <p>
            &copy; <span id="footer-year"></span>
            <span id="footer-company">ParNinja LLC</span>. All rights reserved.
            <a href="/privacy">Privacy</a> · <a href="/data">Your data</a>
          </p>
        </div>
      </footer>
    </div>

    <script>
      (function () {
        const config = window.SITE_CONFIG;
        if (!config) return;

        document.getElementById('site-name').textContent = config.siteName;
        document.getElementById('site-tagline').textContent = config.tagline;
        document.getElementById('site-description').textContent = config.description;
        document.getElementById('footer-year').textContent = config.year;
        document.getElementById('footer-company').textContent = config.company;
        document.title = config.siteName + ' — Golf analytics & performance tracking';

        const appsGrid = document.getElementById('apps-grid');

        config.apps.forEach(function (app) {
          const card = document.createElement('article');
          card.className = 'app-card';

          const header = document.createElement('div');
          header.className = 'app-card-header';

          const icon = document.createElement('img');
          icon.src = app.icon;
          icon.alt = app.name + ' app icon';
          icon.width = 64;
          icon.height = 64;

          const textWrap = document.createElement('div');
          const title = document.createElement('h2');
          title.textContent = app.name;
          const desc = document.createElement('p');
          desc.textContent = app.description;
          textWrap.appendChild(title);
          textWrap.appendChild(desc);

          header.appendChild(icon);
          header.appendChild(textWrap);

          const links = document.createElement('div');
          links.className = 'store-links';
          links.appendChild(createStoreLink('ios', app.iosUrl));
          links.appendChild(createStoreLink('android', app.androidUrl));

          card.appendChild(header);
          card.appendChild(links);
          appsGrid.appendChild(card);
        });

        function createStoreLink(platform, url) {
          if (!url) {
            const badge = document.createElement('span');
            badge.className = 'coming-soon';
            badge.textContent =
              platform === 'ios' ? 'App Store — coming soon' : 'Google Play — coming soon';
            return badge;
          }

          const link = document.createElement('a');
          link.className = 'store-badge';
          link.href = url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';

          if (platform === 'ios') {
            link.setAttribute('aria-label', 'Download on the App Store');
            link.innerHTML =
              '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>' +
              '<span class="store-badge-text"><span class="store-badge-label">Download on the</span><span class="store-badge-name">App Store</span></span>';
          } else {
            link.setAttribute('aria-label', 'Get it on Google Play');
            link.innerHTML =
              '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.609 1.814 13.792 12 3.61 22.186a1.002 1.002 0 0 1-.465-.422 1 1 0 0 1-.12-.59V2.016a1 1 0 0 1 .584-.902zM14.5 12.707l2.302 2.302-10.937 6.333a1 1 0 0 1-.148-.086L14.5 12.707zm3.207-1.414L20.39 8.61a1 1 0 0 1 .61.922v4.936a1 1 0 0 1-.61.922l-2.683 1.55-2.302-2.302 2.302-2.345zM14.5 11.293 5.717 2.51a1 1 0 0 1 .148-.086l10.937 6.333L14.5 11.293z"/></svg>' +
              '<span class="store-badge-text"><span class="store-badge-label">Get it on</span><span class="store-badge-name">Google Play</span></span>';
          }

          return link;
        }
      })();
    </script>
  </body>
</html>
